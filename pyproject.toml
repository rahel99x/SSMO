[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singular-sensitivity"
version = "0.1.0"
description = "Conservative Burgers signed-measure sensitivity research workflow"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "PyYAML==6.0.2", "torch==2.10.0"]

[project.scripts]
ssmo = "singular_sensitivity.cli:main"

[tool.setuptools.packages.find]
include = ["singular_sensitivity*"]
